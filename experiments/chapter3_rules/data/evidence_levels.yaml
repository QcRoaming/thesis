schema_version: 1
levels:
  E1: Direct active source registration, constant, build flag, or API declaration.
  E2: A source fact independently corroborated by another implementation site.
  E3: A deterministic derivation from E1/E2 fields, with the derivation recorded.
  E4: A result calibrated or validated by a controlled experiment on the target host.
  E5: A cross-library or cross-architecture prior that must remain soft until validated.
